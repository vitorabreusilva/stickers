name: Check

# Vercel builds and deploys every push (production from main, previews from branches) through its
# Git integration. This workflow typechecks and tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stickers
          POSTGRES_PASSWORD: stickers
          POSTGRES_DB: stickers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stickers"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://stickers:stickers@localhost:5432/stickers
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The on-device models (~42 MB) aren't in git; scripts/fetch-models.mjs downloads them before the build.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/models.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
